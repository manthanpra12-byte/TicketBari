# TicketBari: Part 3 (gateway with circuit breaker, catalog, booking, workers, postgres, redis, k6)
# Run everything with:  docker compose up --build
# Start from scratch (wipes the database):  docker compose down -v
#
# Values like ${RATE_LIMIT_CAPACITY:-20} mean "use the value from the .env file,
# or 20 if it is not set". Copy .env.example to .env to change them.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ticketbari
      POSTGRES_PASSWORD: ticketbari
      POSTGRES_DB: ticketbari
    ports:
      - "5432:5432"          # so you can open the DB with a tool. Change the left number if 5432 is busy.
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:             # other services wait until this passes
      test: ["CMD-SHELL", "pg_isready -U ticketbari -d ticketbari"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Runs once: creates the tables and sample data, then exits
  migrate:
    build: ./db
    environment:
      DATABASE_URL: postgres://ticketbari:ticketbari@postgres:5432/ticketbari
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  catalog:
    build: ./services/catalog
    ports:
      - "3001:3001"          # exposed only so we can test it directly
    environment:
      PORT: 3001
      DATABASE_URL: postgres://ticketbari:ticketbari@postgres:5432/ticketbari
      REDIS_URL: redis://redis:6379
      CACHE_ENABLED: ${CACHE_ENABLED:-true}      # false = measure the system without the cache
      LOG_REQUESTS: ${LOG_REQUESTS:-true}        # false = quieter logs during load tests
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  booking:
    build: ./services/booking
    ports:
      - "3002:3002"
    environment:
      PORT: 3002
      DATABASE_URL: postgres://ticketbari:ticketbari@postgres:5432/ticketbari
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    build: ./worker
    deploy:
      replicas: 3            # three workers share the booking jobs
    environment:
      DATABASE_URL: postgres://ticketbari:ticketbari@postgres:5432/ticketbari
      REDIS_URL: redis://redis:6379
      PAYMENT_FAIL_RATE: ${PAYMENT_FAIL_RATE:-0.3}   # chance that ONE fake payment attempt fails
      PAYMENT_RETRIES: 3                              # retries after the first attempt (200, 400, 800 ms)
      RECLAIM_IDLE_MS: 30000                          # take over jobs a dead worker left unfinished
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  gateway:
    build: ./gateway
    ports:
      - "8080:8080"          # the only door the outside world uses
    environment:
      PORT: 8080
      CATALOG_URL: http://catalog:3001
      BOOKING_URL: http://booking:3002
      REDIS_URL: redis://redis:6379
      RATE_LIMIT_CAPACITY: ${RATE_LIMIT_CAPACITY:-20}   # max burst per IP
      RATE_LIMIT_REFILL: ${RATE_LIMIT_REFILL:-10}       # tokens added per second
      BREAKER_FAILURES: 5                                # failures in a row before the breaker opens
      BREAKER_RESET_MS: 10000                            # stay open for 10 seconds, then test again
      LOG_REQUESTS: ${LOG_REQUESTS:-true}
    depends_on:
      redis:
        condition: service_healthy
      catalog:
        condition: service_started
      booking:
        condition: service_started

  # The website. Open http://localhost:3000 (it calls the gateway on port 8080).
  frontend:
    build: ./frontend
    ports:
      - "3000:80"

  # Load test. Not started by "docker compose up". Run it with:
  #   docker compose --profile loadtest run --rm k6
  k6:
    image: grafana/k6
    profiles: ["loadtest"]
    volumes:
      - ./loadtest:/scripts
    environment:
      BASE_URL: http://gateway:8080
    command: run --summary-export=/scripts/results/summary.json /scripts/k6-spike.js
    depends_on:
      - gateway

volumes:
  pgdata:
